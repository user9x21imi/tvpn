name: Test terminal panel
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: for script in Riseup-Amsterdam-SteamDeck.sh install-passwordless.sh Install-TVPN-Linux.sh; do bash -n "$script"; done
      - run: for script in platforms/macos/backend.sh platforms/macos/dns-hook platforms/macos/install.sh; do bash -n "$script"; done
  portable:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-windows.txt
      - run: python -m unittest discover -s tests -p test_portable.py -v
      - run: python -m unittest discover -s tests -p test_mac_regressions.py -v
      - run: python -m unittest discover -s tests -p test_updater.py -v
      - run: python -m unittest discover -s tests -p test_globe.py -v
      - run: python -m unittest discover -s tests -p test_ttools.py -v
      - run: python -m unittest discover -s tests -p test_splash.py -v
      - run: python -m compileall -q launch.py riseup-panel.py splash.py install.py manage.py updater.py platforms
      - name: Parse Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @('Install-TVPN-Windows.ps1','platforms/windows/install.ps1')
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
