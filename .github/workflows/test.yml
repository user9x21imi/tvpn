name: Test terminal panel
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: for script in Riseup-Amsterdam-SteamDeck.sh install-passwordless.sh; do bash -n "$script"; done
      - run: for script in platforms/macos/backend.sh platforms/macos/dns-hook platforms/macos/install.sh; do bash -n "$script"; done
  portable:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-windows.txt
      - run: python -m unittest discover -s tests -p test_portable.py -v
      - run: python -m unittest discover -s tests -p test_mac_regressions.py -v
      - run: python -m compileall -q launch.py riseup-panel.py platforms
